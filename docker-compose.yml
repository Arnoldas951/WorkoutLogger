services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tainted
      POSTGRES_DB: workoutlogger
    volumes:
      - workout-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=workoutlogger;Username=postgres;Password=tainted"
      # Read from the host environment or a .env file next to this compose file.
      # The app refuses to start if this is unset or under 32 bytes - see SECURITY.md.
      Jwt__Key: "${JWT_KEY:?set JWT_KEY, e.g. openssl rand -base64 48}"
      Jwt__Issuer: "WorkoutLogger"
      Jwt__Audience: "WorkoutLoggerUsers"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5048:80"
    volumes:
      - ./:/app:ro


  # One-shot, not a long-running service: it is behind a profile so a plain
  # `docker compose up` does not start it. Run it on demand or from the host's
  # scheduler:
  #   docker compose run --rm garmin-sync python probe.py
  #   docker compose run --rm garmin-sync python sync.py --days 7
  garmin-sync:
    profiles: ["tools"]
    build: ./garmin-sync
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: workoutlogger
      PGUSER: postgres
      PGPASSWORD: tainted
      GARMIN_EMAIL: "${GARMIN_EMAIL:-}"
      # Needed for the first login only; safe to blank once a token is stored.
      GARMIN_PASSWORD: "${GARMIN_PASSWORD:-}"
      GARMIN_SYNC_USER_ID: "${GARMIN_SYNC_USER_ID:-1}"
      # Overrides PGHOST/PGDATABASE above. Set when the app's data lives
      # somewhere other than the compose `db` container.
      GARMIN_SYNC_DSN: "${GARMIN_SYNC_DSN:-}"
      GARMINTOKENS: /tokens
    volumes:
      # Tokens survive container rebuilds, so MFA is asked for once.
      - garmin-tokens:/tokens
      # The source, mounted rather than only baked into the image, so editing a
      # script takes effect on the next `run` without a rebuild. The image still
      # carries a copy, so it works without this mount too. Writable because
      # probe.py writes probe-output/ in here for you to read on the host.
      - ./garmin-sync:/app

volumes:
  workout-db-data: {}
  garmin-tokens: {}
